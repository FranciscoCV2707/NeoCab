<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NeoCab · Theme Pack</title>
<meta name="viewport" content="width=1920, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;500;700&family=Russo+One&family=Black+Ops+One&family=VT323&family=Major+Mono+Display&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ── HOST RESET ─────────────────────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;background:#000;color:#eee;overflow:hidden;height:100%;width:100%;
  font-family:'Space Grotesk', 'Inter', system-ui, sans-serif;
  -webkit-font-smoothing:antialiased;}
body{cursor:none}
body.show-cursor{cursor:default}

/* ── STAGE 16:9 ─────────────────────────────────────────────────────────── */
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000;}
.cabinet{
  position:relative;width:1920px;height:1080px;flex:none;
  transform-origin:center center;
  background:#04030a;
  overflow:hidden;
  isolation:isolate;
}

/* ── HOST CHROME: discreet theme indicator (top right) ──────────────────── */
.host-indicator{
  position:absolute;top:18px;right:24px;z-index:9000;
  display:flex;align-items:center;gap:10px;
  padding:6px 12px;
  background:rgba(8,6,15,.7);backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.15);border-radius:99px;
  font-family:'JetBrains Mono', monospace;font-size:10px;letter-spacing:.32em;
  color:rgba(255,255,255,.55);text-transform:uppercase;
  pointer-events:none;
}
.host-indicator b{color:#fff;font-weight:500;letter-spacing:.16em}
.host-indicator .kk{
  display:inline-flex;align-items:center;justify-content:center;
  width:18px;height:18px;border:1px solid rgba(255,255,255,.35);
  color:rgba(255,255,255,.85);font-size:9px;font-weight:600;letter-spacing:0;
}

/* ── THEME SWITCHER SCREEN ──────────────────────────────────────────────── */
.switcher{
  position:absolute;inset:0;top:0;left:0;width:100%;height:100%;z-index:8000;
  background:
    radial-gradient(60% 60% at 20% 30%, rgba(85, 32, 120, .25), transparent 70%),
    radial-gradient(60% 60% at 80% 70%, rgba(20, 60, 120, .25), transparent 70%),
    linear-gradient(180deg, #0b0816 0%, #04030a 100%);
  display:flex;flex-direction:column;
  padding:64px 80px;gap:32px;
}
.switcher-head{display:flex;align-items:flex-end;justify-content:space-between;gap:40px;}
.switcher-head .left{display:flex;flex-direction:column;gap:6px}
.switcher-head .eyebrow{
  font-family:'JetBrains Mono', monospace;font-size:12px;letter-spacing:.5em;
  color:rgba(255,255,255,.45);text-transform:uppercase;
}
.switcher-head .ttl{
  font-family:'Major Mono Display','Russo One',monospace;
  font-size:88px;line-height:.95;letter-spacing:-.005em;color:#fff;
  text-shadow:0 0 30px rgba(255,255,255,.18);
}
.switcher-head .ttl b{color:#ffb000}
.switcher-head .sub{
  font-family:'JetBrains Mono', monospace;font-size:14px;letter-spacing:.18em;
  color:rgba(255,255,255,.6);max-width:520px;text-transform:uppercase;
}
.switcher-head .right{
  font-family:'JetBrains Mono', monospace;font-size:11px;letter-spacing:.32em;
  color:rgba(255,255,255,.5);text-align:right;text-transform:uppercase;
  display:flex;flex-direction:column;gap:8px;
}
.switcher-head .right b{color:#fff;font-weight:500}

.switcher-grid{
  display:grid;grid-template-columns:repeat(5, 1fr);gap:20px;flex:1;min-height:0;
}
.theme-card{
  position:relative;display:flex;flex-direction:column;cursor:pointer;
  background:linear-gradient(180deg, rgba(20,16,32,.92), rgba(8,6,15,.92));
  border:1px solid rgba(255,255,255,.08);
  border-radius:14px;overflow:hidden;
  transition:transform 280ms cubic-bezier(.18,.9,.22,1.05), border-color 280ms ease, box-shadow 280ms ease;
}
.theme-card:hover, .theme-card.focused{
  transform:translateY(-6px);
  border-color:rgba(255,255,255,.4);
  box-shadow:0 18px 60px rgba(0,0,0,.6), 0 0 36px color-mix(in oklch, var(--accent, #ffb000) 50%, transparent);
}
.theme-card.active{
  border-color:var(--accent, #ffb000);
  box-shadow:0 0 40px var(--accent, #ffb000), 0 0 80px var(--accent, #ffb000) ;
}
.theme-card .preview{
  position:relative;aspect-ratio:16/10;
  background:linear-gradient(135deg, color-mix(in oklch, var(--accent) 50%, #04030a) 0%, #04030a 80%);
  border-bottom:1px solid rgba(255,255,255,.08);
  overflow:hidden;
}
.theme-card .preview-noise{
  position:absolute;inset:0;opacity:.18;mix-blend-mode:screen;pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' seed='4'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
}
.theme-card .preview-scan{
  position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(to bottom, rgba(0,0,0,.25) 0 1px, transparent 1px 3px);
  mix-blend-mode:multiply;
}
.theme-card .preview svg{
  position:absolute;inset:0;width:100%;height:100%;
}
.theme-card .body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:10px;flex:1;}
.theme-card .badge{
  display:inline-flex;align-items:center;gap:6px;align-self:flex-start;
  padding:3px 9px;border-radius:99px;
  background:var(--accent);color:#0a0712;
  font-family:'JetBrains Mono', monospace;font-size:9px;letter-spacing:.3em;font-weight:600;
  text-transform:uppercase;
}
.theme-card .badge.planned{
  background:transparent;color:rgba(255,255,255,.5);
  border:1px solid rgba(255,255,255,.2);
}
.theme-card .name{
  font-family:'Russo One', sans-serif;font-size:22px;line-height:1.05;
  color:#fff;letter-spacing:.005em;
}
.theme-card .tagline{
  font-family:'JetBrains Mono', monospace;font-size:11px;letter-spacing:.18em;
  color:rgba(255,255,255,.65);text-transform:uppercase;line-height:1.4;
}
.theme-card .insp{
  font-family:'JetBrains Mono', monospace;font-size:10px;letter-spacing:.16em;
  color:rgba(255,255,255,.4);margin-top:auto;
  border-top:1px dashed rgba(255,255,255,.1);padding-top:10px;
}
.theme-card.focused .preview::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(180deg, transparent 50%, color-mix(in oklch, var(--accent) 80%, transparent) 100%);
  mix-blend-mode:screen;opacity:.4;
}

/* legend at bottom of switcher */
.switcher-foot{
  display:flex;justify-content:space-between;align-items:center;
  padding:18px 0 0;border-top:1px dashed rgba(255,255,255,.1);
  font-family:'JetBrains Mono', monospace;font-size:11px;letter-spacing:.32em;
  color:rgba(255,255,255,.55);text-transform:uppercase;
}
.switcher-foot .keys{display:flex;align-items:center;gap:22px;}
.switcher-foot .kk{
  display:inline-flex;align-items:center;justify-content:center;
  padding:3px 9px;border:1px solid rgba(255,255,255,.25);border-radius:6px;
  color:rgba(255,255,255,.9);margin-right:8px;font-size:10px;letter-spacing:.14em;
}

/* "coming soon" full-screen placeholder for planned themes */
.coming{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  background:radial-gradient(70% 60% at 50% 50%, rgba(30,24,50,.6), #04030a 80%);
  color:#fff;flex-direction:column;gap:20px;text-align:center;padding:60px;
}
.coming .glyph{
  font-family:'Major Mono Display', monospace;font-size:140px;color:var(--accent);
  text-shadow:0 0 40px var(--accent);
}
.coming .ttl{font-family:'Russo One', sans-serif;font-size:54px;letter-spacing:.02em;text-transform:uppercase;}
.coming .sub{
  font-family:'JetBrains Mono', monospace;font-size:14px;letter-spacing:.26em;
  color:rgba(255,255,255,.55);max-width:560px;text-transform:uppercase;
}
.coming .keys{
  margin-top:20px;display:flex;gap:14px;
  font-family:'JetBrains Mono', monospace;font-size:11px;letter-spacing:.3em;
  color:rgba(255,255,255,.55);text-transform:uppercase;
}
.coming .kk{
  display:inline-flex;align-items:center;justify-content:center;
  padding:3px 9px;border:1px solid rgba(255,255,255,.3);border-radius:6px;color:#fff;
  margin-right:8px;
}

/* [data-screen-label] is metadata only — does not affect layout */

/* ═════════════════════════════════════════════════════════════════════════
   SHARED HOME / SETTINGS / THEMES PANEL  (.nc-*)
   Each theme sets these CSS vars on its root scope:
     --nc-h, --nc-h2  → hue / hue2 for tinting
     --nc-bone        → high-contrast text color (defaults to #f6f3eb)
     --nc-bg-deep     → deepest background color
     --nc-font-display, --nc-font-marquee, --nc-font-mono → font stack
   ═════════════════════════════════════════════════════════════════════════ */
.theme-batocera, .theme-operator, .theme-hyperrush, .theme-flux, .theme-neonwall{
  --nc-bone:#f6f3eb;
  --nc-amber:#ffd166;
  --nc-bg-deep:#04030a;
  --nc-font-display:'Russo One', sans-serif;
  --nc-font-marquee:'Bebas Neue', sans-serif;
  --nc-font-mono:'JetBrains Mono', monospace;
  --nc-font-body:'Space Grotesk', sans-serif;
}
.theme-batocera { --nc-h: var(--bat-h, 220); --nc-h2: var(--bat-h2, 280); }
.theme-operator { --nc-h: 130;               --nc-h2: 75; --nc-bone: var(--op-fg, #66ff8a); --nc-font-display:'Russo One', sans-serif; --nc-font-marquee:'VT323', monospace; }
.theme-hyperrush{ --nc-h: var(--hr-h, 35);   --nc-h2: var(--hr-h2, 320); }
.theme-flux     { --nc-h: var(--fx-h, 290);  --nc-h2: var(--fx-h2, 50); }
.theme-neonwall { --nc-h: var(--nw-h, 270);  --nc-h2: var(--nw-h2, 340); }

/* ───── HOME ───── */
.nc-home{
  position:absolute;inset:0;z-index:5;
  display:grid;grid-template-columns: 1.15fr .85fr;
  gap:48px;padding:60px 60px 60px;align-items:stretch;
}

.nc-home-left{display:flex;flex-direction:column;gap:24px;justify-content:space-between;min-width:0;}
.nc-eyebrow{
  display:flex;align-items:center;gap:14px;
  font-family:var(--nc-font-mono);font-size:11px;letter-spacing:.4em;
  color:rgba(255,255,255,.5);text-transform:uppercase;
}
.nc-dot{
  width:8px;height:8px;background:#5cff8a;border-radius:50%;
  box-shadow:0 0 10px #5cff8a, 0 0 22px #5cff8a;
  animation:ncBlink 1.6s ease-in-out infinite;
}
@keyframes ncBlink{0%,100%{opacity:1}50%{opacity:.4}}

.nc-wordmark{display:flex;flex-direction:column;line-height:.78;min-width:0;}
.nc-wordmark-l1, .nc-wordmark-l2{
  font-family:var(--nc-font-display);font-size:200px;letter-spacing:-.012em;
  color:var(--nc-bone);text-transform:uppercase;line-height:.82;
  text-shadow:
    0 8px 0 oklch(28% 0.20 var(--nc-h)),
    0 16px 0 oklch(18% 0.16 var(--nc-h)),
    0 24px 60px rgba(0,0,0,.65),
    0 0 60px oklch(60% 0.24 var(--nc-h) / .45);
}
.nc-wordmark-l2{
  -webkit-text-stroke:3px var(--nc-amber);color:transparent;
  text-shadow:0 0 24px oklch(70% 0.22 var(--nc-h) / .55);
  margin-top:-12px;margin-left:24px;
}
.nc-wordmark-sub{
  margin-top:14px;font-family:var(--nc-font-marquee);font-size:28px;letter-spacing:.32em;
  color:rgba(255,255,255,.5);text-transform:uppercase;
}
.nc-amber{color:var(--nc-amber);text-shadow:0 0 10px var(--nc-amber);}

.nc-stats{
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));
  border-top:1px solid oklch(60% 0.14 var(--nc-h) / .3);
  border-bottom:1px solid oklch(60% 0.14 var(--nc-h) / .3);
  padding:14px 0;
}
.nc-stat{display:flex;flex-direction:column;gap:4px;padding:0 18px;min-width:0;
  border-right:1px dashed rgba(255,255,255,.08);}
.nc-stat:last-child{border-right:0}
.nc-k{font-family:var(--nc-font-mono);font-size:10px;letter-spacing:.34em;color:rgba(255,255,255,.5);text-transform:uppercase;}
.nc-v{font-family:var(--nc-font-marquee);font-size:28px;line-height:1;color:var(--nc-bone);letter-spacing:.04em;
  font-variant-numeric:tabular-nums;white-space:nowrap;}

.nc-ticker{
  position:relative;display:flex;align-items:center;gap:18px;padding:10px 18px;overflow:hidden;
  background:linear-gradient(to right, oklch(16% 0.05 var(--nc-h) / .9), oklch(8% 0.03 var(--nc-h) / .4));
  border:1px solid oklch(60% 0.14 var(--nc-h) / .35);
}
.nc-ticker-lbl{
  font-family:var(--nc-font-mono);font-size:11px;letter-spacing:.36em;color:var(--nc-amber);
  text-shadow:0 0 8px var(--nc-amber);text-transform:uppercase;padding-right:14px;
  border-right:1px dashed rgba(255,255,255,.16);flex:none;
}
.nc-ticker-track{flex:1;overflow:hidden;min-width:0;}
.nc-ticker-inner{display:flex;align-items:center;gap:18px;animation:ncTicker 28s linear infinite;width:max-content;}
.nc-ticker-inner > *{flex:none;font-family:var(--nc-font-marquee);font-size:22px;letter-spacing:.18em;color:var(--nc-bone);}
.nc-ticker-pip{color:oklch(75% 0.18 var(--nc-h));font-size:18px;}
@keyframes ncTicker{from{transform:translateX(0)}to{transform:translateX(-50%)}}

.nc-home-right{display:flex;flex-direction:column;gap:18px;padding:18px 0;min-width:0;}
.nc-menu-head{display:flex;align-items:center;gap:14px;
  font-family:var(--nc-font-mono);font-size:11px;letter-spacing:.4em;color:rgba(255,255,255,.5);
  text-transform:uppercase;padding:0 4px 4px;}
.nc-menu-head-line{flex:1;height:1px;background:linear-gradient(to right, transparent, oklch(60% 0.18 var(--nc-h) / .55), transparent);}
.nc-menu-head-lbl{color:var(--nc-bone);text-shadow:0 0 8px var(--nc-amber);}

.nc-menu, .nc-settings-list{display:flex;flex-direction:column;gap:10px;}
.nc-menu-item{
  all:unset;display:flex;align-items:center;gap:18px;cursor:pointer;padding:14px 22px;position:relative;
  background:linear-gradient(135deg, oklch(14% 0.05 var(--nc-h) / .85) 0%, oklch(8% 0.03 var(--nc-h) / .82) 100%);
  border:1px solid oklch(40% 0.10 var(--nc-h) / .4);
  clip-path:polygon(14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%, 0 14px);
  transition:transform 240ms cubic-bezier(.18,.9,.22,1.05),
             background 240ms ease, border-color 240ms ease, box-shadow 240ms ease;
}
.nc-mi-num{font-family:var(--nc-font-mono);font-size:11px;letter-spacing:.3em;color:rgba(255,255,255,.5);min-width:30px;}
.nc-mi-icon{
  width:42px;height:42px;display:flex;align-items:center;justify-content:center;
  font-family:var(--nc-font-display);font-size:22px;color:var(--nc-bone);
  background:linear-gradient(135deg, oklch(28% 0.14 var(--nc-h)), oklch(14% 0.08 var(--nc-h)));
  border:1px solid oklch(60% 0.18 var(--nc-h) / .45);flex:none;
}
.nc-mi-body{display:flex;flex-direction:column;gap:3px;line-height:1;min-width:0;}
.nc-mi-label{font-family:var(--nc-font-display);font-size:28px;color:var(--nc-bone);letter-spacing:.01em;text-transform:uppercase;}
.nc-mi-tag{font-family:var(--nc-font-mono);font-size:11px;letter-spacing:.3em;color:rgba(255,255,255,.5);text-transform:uppercase;}
.nc-mi-arrow{margin-left:auto;font-family:var(--nc-font-marquee);font-size:26px;color:var(--nc-amber);
  text-shadow:0 0 12px var(--nc-amber);animation:ncArrow 1s ease-in-out infinite alternate;}
@keyframes ncArrow{from{transform:translateX(0)}to{transform:translateX(6px)}}

.nc-menu-item.is-active{
  background:linear-gradient(135deg,
    oklch(55% 0.22 var(--nc-h)) 0%,
    oklch(32% 0.18 var(--nc-h)) 60%,
    var(--nc-bg-deep) 100%);
  border-color:var(--nc-bone);
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.25),
    0 0 30px oklch(60% 0.22 var(--nc-h) / .8),
    0 0 70px oklch(60% 0.22 var(--nc-h) / .45);
  transform:translateX(6px);
}
.nc-menu-item.is-active .nc-mi-icon{
  background:linear-gradient(135deg, #fff3d4, var(--nc-amber));
  color:#08060f;border-color:#fff3d4;box-shadow:0 0 18px var(--nc-amber);
}

.nc-credits{
  margin-top:auto;padding:10px 14px;text-align:center;
  font-family:var(--nc-font-mono);font-size:11px;letter-spacing:.4em;color:var(--nc-amber);
  text-shadow:0 0 8px var(--nc-amber);text-transform:uppercase;
  border-top:1px dashed rgba(255,255,255,.12);
}
.nc-credits b{color:var(--nc-bone);font-weight:400;font-family:var(--nc-font-marquee);font-size:16px;letter-spacing:.1em;}

/* ───── SETTINGS ───── */
.nc-settings{
  position:absolute;inset:0;z-index:5;
  display:grid;grid-template-columns:.9fr 1.1fr;gap:60px;padding:60px 80px;
}
.nc-settings-head{display:flex;flex-direction:column;justify-content:center;gap:14px;min-width:0;}
.nc-settings-title{
  font-family:var(--nc-font-display);font-size:140px;line-height:.85;
  color:var(--nc-bone);letter-spacing:-.005em;text-transform:uppercase;
  text-shadow:
    0 6px 0 oklch(28% 0.18 var(--nc-h)),
    0 12px 30px rgba(0,0,0,.6),
    0 0 38px oklch(60% 0.22 var(--nc-h) / .55);
}
.nc-settings-sub{font-family:var(--nc-font-body);font-size:18px;color:rgba(255,255,255,.6);line-height:1.4;max-width:480px;}
.nc-settings-sub b{color:var(--nc-amber);font-weight:600;}
.nc-settings-list{display:flex;flex-direction:column;gap:8px;align-self:center;width:100%;}

/* ───── THEME SWITCHER (full-screen panel) ───── */
.nc-themes-panel{
  position:absolute;inset:0;z-index:6;
  display:flex;flex-direction:column;gap:24px;padding:48px 64px;
  background:
    radial-gradient(60% 60% at 20% 30%, oklch(20% 0.16 var(--nc-h) / .35), transparent 70%),
    radial-gradient(60% 60% at 80% 70%, oklch(20% 0.16 var(--nc-h2) / .25), transparent 70%),
    linear-gradient(180deg, oklch(10% 0.04 var(--nc-h)) 0%, var(--nc-bg-deep) 100%);
}
.nc-themes-head{display:flex;flex-direction:column;gap:6px;flex:none;}
.nc-themes-title{
  font-family:var(--nc-font-display);font-size:74px;line-height:.95;color:var(--nc-bone);
  letter-spacing:-.005em;text-shadow:0 0 30px rgba(255,255,255,.18);
}
.nc-themes-title b{color:var(--nc-amber);}
.nc-themes-sub{font-family:var(--nc-font-mono);font-size:13px;letter-spacing:.18em;color:rgba(255,255,255,.6);max-width:560px;text-transform:uppercase;}

.nc-themes-grid{display:grid;grid-template-columns:repeat(5, 1fr);gap:16px;flex:1;min-height:0;}
.nc-theme-card{
  position:relative;display:flex;flex-direction:column;cursor:pointer;
  background:linear-gradient(180deg, rgba(20,16,32,.92), rgba(8,6,15,.92));
  border:1px solid rgba(255,255,255,.08);border-radius:12px;overflow:hidden;
  transition:transform 280ms cubic-bezier(.18,.9,.22,1.05), border-color 280ms ease, box-shadow 280ms ease;
}
.nc-theme-card.is-focused{
  transform:translateY(-6px);
  border-color:rgba(255,255,255,.4);
  box-shadow:0 18px 60px rgba(0,0,0,.6), 0 0 36px color-mix(in oklch, var(--accent, var(--nc-amber)) 50%, transparent);
}
.nc-theme-card.is-active{
  border-color:var(--accent, var(--nc-amber));
  box-shadow:0 0 32px var(--accent, var(--nc-amber));
}
.nc-tc-preview{
  position:relative;aspect-ratio:16/10;
  background:linear-gradient(135deg, color-mix(in oklch, var(--accent) 50%, var(--nc-bg-deep)) 0%, var(--nc-bg-deep) 80%);
  border-bottom:1px solid rgba(255,255,255,.08);overflow:hidden;
}
.nc-tc-preview svg{position:absolute;inset:0;width:100%;height:100%;}
.nc-tc-scan{position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(to bottom, rgba(0,0,0,.25) 0 1px, transparent 1px 3px);mix-blend-mode:multiply;}
.nc-tc-body{padding:16px 18px;display:flex;flex-direction:column;gap:6px;flex:1;}
.nc-tc-badge{
  display:inline-flex;align-items:center;align-self:flex-start;padding:3px 9px;border-radius:99px;
  background:var(--accent);color:#0a0712;
  font-family:var(--nc-font-mono);font-size:9px;letter-spacing:.3em;font-weight:600;text-transform:uppercase;
}
.nc-tc-name{font-family:var(--nc-font-display);font-size:20px;color:#fff;letter-spacing:.005em;line-height:1.05;}
.nc-tc-tagline{font-family:var(--nc-font-mono);font-size:10px;letter-spacing:.18em;color:rgba(255,255,255,.65);text-transform:uppercase;line-height:1.4;}
.nc-tc-insp{margin-top:auto;font-family:var(--nc-font-mono);font-size:9px;letter-spacing:.16em;color:rgba(255,255,255,.4);
  border-top:1px dashed rgba(255,255,255,.1);padding-top:10px;}

.nc-themes-foot{display:flex;align-items:center;gap:24px;padding-top:14px;border-top:1px dashed rgba(255,255,255,.1);
  font-family:var(--nc-font-mono);font-size:11px;letter-spacing:.32em;color:rgba(255,255,255,.55);text-transform:uppercase;flex:none;}
.nc-kk{display:inline-flex;align-items:center;justify-content:center;padding:3px 9px;border:1px solid rgba(255,255,255,.25);
  border-radius:6px;color:#fff;font-size:10px;letter-spacing:.14em;margin-right:8px;}

/* ═════════════════════════════════════════════════════════════════════════
   THEME TRANSITION — CRT "channel switch" power-off / power-on
   ═════════════════════════════════════════════════════════════════════════ */
.nc-stage-wrap{position:absolute;inset:0;transform-origin:center center;backface-visibility:hidden;}
.nc-stage-wrap.is-out{animation:ncCrtOff .50s cubic-bezier(.7,.02,.96,.3) forwards;}
.nc-stage-wrap.is-in {animation:ncCrtOn  .80s cubic-bezier(.14,.86,.4,1) forwards;}
@keyframes ncCrtOff{
  0%  {transform:scale(1,1);       filter:brightness(1)   contrast(1);}
  50% {transform:scale(1.035,.016);filter:brightness(3.4) contrast(1.5);}
  70% {transform:scale(1.04,.014); filter:brightness(4.5) contrast(1.6);}
  100%{transform:scale(.0015,.0018);filter:brightness(16) contrast(2);opacity:.5;}
}
@keyframes ncCrtOn{
  0%  {transform:scale(.0015,.0018);filter:brightness(18) contrast(2);opacity:.5;}
  26% {transform:scale(1.05,.02);   filter:brightness(7)  contrast(1.7);opacity:1;}
  50% {transform:scale(1.05,.02);   filter:brightness(3.4);}
  74% {transform:scale(1,.52);      filter:brightness(1.7);}
  100%{transform:scale(1,1);        filter:brightness(1);}
}

/* overlay that covers the swap seam + carries flash, sweep & boot badge */
.nc-xfade{position:absolute;inset:0;z-index:9500;pointer-events:none;overflow:hidden;--xacc:#ffb000;}
.nc-xfade.is-in{animation:ncXFadeOut .80s ease forwards;}
@keyframes ncXFadeOut{0%,68%{opacity:1}100%{opacity:0}}

/* white bloom flash, peaking at the collapse seam */
.nc-xfade-flash{position:absolute;inset:0;opacity:0;
  background:radial-gradient(130% 70% at 50% 50%, #fff, rgba(255,255,255,0) 72%);}
.nc-xfade.is-out .nc-xfade-flash{animation:ncXOutFlash .50s ease-in forwards;}
.nc-xfade.is-in  .nc-xfade-flash{animation:ncXInFlash  .55s ease-out forwards;}
@keyframes ncXOutFlash{0%{opacity:0}68%{opacity:.06}100%{opacity:.9}}
@keyframes ncXInFlash {0%{opacity:.9}45%{opacity:.18}100%{opacity:0}}

/* hot horizontal collapse line (the picture squeezing into a single scanline) */
.nc-xfade-line{position:absolute;left:0;right:0;top:50%;height:3px;opacity:0;
  transform:translateY(-50%) scaleX(0);
  background:linear-gradient(90deg,transparent,#fff 10%,#fff 90%,transparent);
  box-shadow:0 0 22px 5px #fff, 0 0 70px 14px var(--xacc);}
.nc-xfade.is-out .nc-xfade-line{animation:ncXLine .50s ease-out forwards;}
.nc-xfade.is-in  .nc-xfade-line{animation:ncXLineOut .34s ease-in forwards;}
@keyframes ncXLine{0%{opacity:0;transform:translateY(-50%) scaleX(0)}48%{opacity:1;transform:translateY(-50%) scaleX(1)}100%{opacity:1;transform:translateY(-50%) scaleX(1)}}
@keyframes ncXLineOut{0%{opacity:1;transform:translateY(-50%) scaleY(1)}100%{opacity:0;transform:translateY(-50%) scaleY(8)}}

/* scanline sweep on power-on */
.nc-xfade-sweep{position:absolute;left:0;right:0;height:34%;top:-34%;opacity:0;mix-blend-mode:screen;
  background:linear-gradient(180deg,transparent, color-mix(in oklch,var(--xacc) 70%,transparent) 62%,#fff);}
.nc-xfade.is-in .nc-xfade-sweep{animation:ncXSweep .80s ease-in-out forwards;}
@keyframes ncXSweep{0%{top:-34%;opacity:.7}90%{opacity:.25}100%{top:104%;opacity:0}}

/* thin animated scanlines over the dark seam */
.nc-xfade-grid{position:absolute;inset:0;opacity:0;
  background:repeating-linear-gradient(to bottom, rgba(255,255,255,.05) 0 1px, transparent 1px 3px);}
.nc-xfade.is-out .nc-xfade-grid{animation:ncXGrid .50s ease-in forwards;}
@keyframes ncXGrid{0%{opacity:0}100%{opacity:.5}}

/* boot badge — incoming theme name + progress bar */
.nc-xfade-badge{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);opacity:0;
  display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;width:680px;}
.nc-xfade.is-out .nc-xfade-badge{animation:ncXBadgeIn .50s .14s ease forwards;}
.nc-xfade.is-in  .nc-xfade-badge{opacity:1;transform:translate(-50%,-50%) scale(1);}
@keyframes ncXBadgeIn{0%{opacity:0;transform:translate(-50%,-50%) scale(.88)}100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.nc-xfade-k{font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:.52em;
  color:rgba(255,255,255,.7);text-transform:uppercase;}
.nc-xfade-k b{color:var(--xacc);}
.nc-xfade-name{font-family:'Russo One',sans-serif;font-size:84px;line-height:.92;letter-spacing:.01em;
  color:#fff;text-transform:uppercase;text-shadow:0 0 30px var(--xacc),0 0 70px var(--xacc);}
.nc-xfade-tag{font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:.28em;
  color:rgba(255,255,255,.6);text-transform:uppercase;}
.nc-xfade-bar{width:420px;height:6px;margin-top:6px;border:1px solid rgba(255,255,255,.25);
  background:rgba(0,0,0,.5);overflow:hidden;}
.nc-xfade-bar > span{display:block;height:100%;width:0;background:var(--xacc);
  box-shadow:0 0 14px var(--xacc);transition:width .5s linear;}
.nc-xfade.is-out .nc-xfade-bar > span{width:58%;}
.nc-xfade.is-in  .nc-xfade-bar > span{width:100%;transition:width .42s ease-out;}

</style>
</head>
<body>
<div id="stage">
  <div class="cabinet" id="cabinet" data-screen-label="Theme Pack Host">
    <div id="root"></div>
  </div>
</div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="themes/themes-data.jsx"></script>

<script type="text/babel" src="themes/theme-operator.jsx"></script>

<script>
  function fitStage(){
    const stage = document.getElementById('stage');
    const cab = document.getElementById('cabinet');
    if(!stage || !cab) return;
    const sw = window.innerWidth, sh = window.innerHeight;
    const scale = Math.min(sw/1920, sh/1080);
    cab.style.transform = `scale(${scale})`;
  }
  window.addEventListener('resize', fitStage);
  window.addEventListener('load', fitStage);
  fitStage();
</script>
