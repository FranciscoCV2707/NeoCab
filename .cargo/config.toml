# NeoCab Platform-Specific Build Configuration

# Default target for development (current platform)
[build]
jobs = 4

# Windows XP (i686 MSVC) - 32-bit support
# NOTE: opt-level/target-cpu solo aplicados en release. Aqui solo el linker.
[target.i686-pc-windows-msvc]
linker = "link.exe"
ar = "lib.exe"
rustflags = [
    "-C", "link-arg=/SUBSYSTEM:WINDOWS,5.01"
]

# Windows XP (x86_64 MSVC) - 64-bit support
# (sin rustflags para no romper debug_assertions de Tauri macros)

# Windows GNU 32-bit
[target.i686-pc-windows-gnu]
rustflags = [
    "-C", "link-arg=-Wl,--subsystem,windows"
]

# Linux ARM (Raspberry Pi 32-bit)
[target.armv7-unknown-linux-gnueabihf]
linker = "arm-linux-gnueabihf-gcc"
rustflags = [
    "-C", "link-arg=-mfpu=neon"
]

# Profile settings
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1
debug-assertions = true

[profile.dev.build-override]
debug-assertions = true

[profile.dev.package."*"]
debug-assertions = true

# Feature flags during build
# [env]
# RUSTFLAGS = "-D warnings"
