[package]
name = "neocab"
version = "0.1.0"
description = "Professional arcade cabinet operating system"
authors = ["Francisco Caballero"]
license = "GPL-3.0-or-later"
edition = "2021"

[lib]
name = "neocab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.1", features = [] }

[dependencies]
# Tauri core
tauri = { version = "=2.11.1", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"

# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Database
sqlx = { version = "0.7", features = ["runtime-tokio", "sqlite", "migrate", "macros", "chrono"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Utilities
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
thiserror = "1.0"
async-trait = "0.1"
async-recursion = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Filesystem
walkdir = "2.4"
notify = "6.1"

# Hashing & crypto
sha2 = "0.10"
crc32fast = "1.3"
bcrypt = "0.15"

# Compression
zip = "0.6"

# System info
sysinfo = "0.30"

# Paths
dirs = "5.0"

# HTTP (optional for scrapers)
reqwest = { version = "0.11", features = ["json", "blocking"] }
urlencoding = "2.1"
quick-xml = { version = "0.31", features = ["serialize"] }

# Networking (Phase 7)
mdns-sd = "0.13"
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["cors"] }

# Input handling
# sdl2 and gilrs for legacy mode
sdl2 = { version = "0.36", features = ["bundled"], optional = true }
gilrs = { version = "0.10", optional = true }

# Graphics (legacy mode)
gl = { version = "0.14", optional = true }
glfw = { version = "0.54", optional = true }

# Hardware integration
serialport = { version = "4.3", optional = true }
rppal = { version = "0.14", optional = true }
enigo = "0.6.1"
winapi = { version = "0.3.9", features = ["winuser", "winbase", "windef"] }

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.52"
windows = { version = "0.54", features = ["Win32_Foundation", "Win32_System_SystemInformation"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
nix = "0.27"

[features]
default = ["modern-ui"]
modern-ui = []
legacy-ui = ["dep:sdl2", "dep:gilrs", "dep:gl"]
hardware-gpio = ["dep:rppal"]
hardware-arduino = ["dep:serialport"]
platform-detection = ["dep:windows"]
scrapers = []
all-features = ["legacy-ui", "hardware-gpio", "hardware-arduino", "platform-detection"]

