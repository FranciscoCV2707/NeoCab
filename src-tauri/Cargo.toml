[package]
name = "neocab"
version = "0.1.0"
description = "Professional arcade cabinet operating system"
authors = ["Francisco Caballero"]
license = "GPL-3.0-or-later"
edition = "2021"

[lib]
name = "neocab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = "2.0"

[dependencies]
# Tauri core
tauri = { version = "2.0" }
tauri-plugin-shell = "2.0"
tauri-plugin-fs = "2.0"
tauri-plugin-dialog = "2.0"

# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Database
sqlx = { version = "0.7", features = ["runtime-tokio", "sqlite", "migrate", "macros", "chrono"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Utilities
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
thiserror = "1.0"
async-trait = "0.1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Filesystem
walkdir = "2.4"
notify = "6.1"

# Hashing & crypto
sha2 = "0.10"
crc32fast = "1.3"
bcrypt = "0.15"

# Compression
zip = "0.6"

# System info
sysinfo = "0.30"

# Paths
dirs = "5.0"

# HTTP (optional for scrapers)
reqwest = { version = "0.11", features = ["json", "blocking"], optional = true }

# Input handling (Semana 10)
# sdl2 = { version = "0.36", features = ["bundled"] }
# gilrs = "0.10"

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.52"

[target.'cfg(target_os = "linux")'.dependencies]
nix = "0.27"

[features]
default = []
scrapers = ["dep:reqwest"]

