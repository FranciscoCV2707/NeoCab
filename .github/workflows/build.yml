name: Build NeoCab

on:
  push:
    branches: [ main, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, develop ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config libsdl2-dev

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cargo check
        run: cargo check --release
        working-directory: ./src-tauri

      - name: Run tests
        run: cargo test --release
        working-directory: ./src-tauri

      - name: npm install
        run: npm install

      - name: Run frontend tests
        run: npm test
        working-directory: ./

      - name: Build frontend
        run: npm run build
        working-directory: ./

  build-windows:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: npm install
        run: npm install

      - name: Build (Tauri)
        run: npm run tauri build

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeoCab-Windows-x64
          path: src-tauri/target/release/*.msi

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeoCab-Windows-portable
          path: src-tauri/target/release/*.exe
          if-no-files-found: ignore

  build-linux:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config libsdl2-dev

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: npm install
        run: npm install

      - name: Build (Tauri)
        run: npm run tauri build

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeoCab-Linux-x86_64
          path: src-tauri/target/release/*.AppImage

  build-linux-arm:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        include:
          - target: armv7-unknown-linux-gnueabihf
            arch: armv7
            name: NeoCab-Linux-ARM32
          - target: aarch64-unknown-linux-gnu
            arch: aarch64
            name: NeoCab-Linux-ARM64
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install ARM build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libssl-dev pkg-config libsdl2-dev \
            gcc-${{ matrix.arch }}-linux-gnu

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: npm install
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Build (Cargo for ARM)
        run: |
          cargo build --target ${{ matrix.target }} --release
        working-directory: ./src-tauri

      - name: Build AppImage
        run: ./build-scripts/build-appimage-arm.sh 1.0 ${{ matrix.arch }}
        shell: bash

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: src-tauri/target/${{ matrix.target }}/release/*.AppImage
          if-no-files-found: ignore

  create-release:
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux, build-linux-arm]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create Release Notes
        run: |
          echo "# NeoCab Release" > RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "Version: ${{ github.ref_name }}" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "## Downloads" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "### Windows" >> RELEASE_NOTES.md
          echo "- MSI Installer (recommended)" >> RELEASE_NOTES.md
          echo "- Portable EXE" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "### Linux" >> RELEASE_NOTES.md
          echo "- AppImage x86_64" >> RELEASE_NOTES.md
          echo "- AppImage ARM32 (RPi 3/4)" >> RELEASE_NOTES.md
          echo "- AppImage ARM64 (RPi 5)" >> RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: release-artifacts/**/*
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-legacy-windows:
    runs-on: windows-latest
    needs: test
    if: false  # Disabled until SDL2 setup is automated
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup SDL2
        run: |
          # Download SDL2 dev libs
          Invoke-WebRequest -Uri "https://github.com/libsdl-org/SDL/releases/download/release-2.28.5/SDL2-devel-2.28.5-VC.zip" -OutFile "SDL2.zip"
          Expand-Archive -Path "SDL2.zip" -DestinationPath "C:\"
          echo "SDL2_DIR=C:\SDL2-2.28.5" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Legacy Mode
        run: |
          cargo build --release --features legacy-ui
        working-directory: ./src-tauri

      - name: Upload Legacy EXE
        uses: actions/upload-artifact@v4
        with:
          name: NeoCab-Windows-XP-Legacy
          path: src-tauri/target/release/neocab.exe
