[package]
name = "neocab-updater"
version = "1.0.0"
description = "NeoCab auto-updater - standalone binary"
authors = ["Francisco Caballero"]
license = "GPL-3.0-or-later"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["blocking", "json"] }
zip = "2.2"
sha2 = "0.10"
hex = "0.4"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["processthreadsapi", "synchapi", "handleapi", "winnt"] }
